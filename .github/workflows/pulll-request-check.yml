name: Pull Request Check

on:
  pull_request:
    branches: [ 'main' ]

jobs:
  pr-quality-gate:
    runs-on: ubuntu-latest
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ secrets.DB_NAME_CI }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USER_CI }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD_CI }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: ${{ secrets.DB_USER_CI }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD_CI }}
          POSTGRES_DB: ${{ secrets.DB_NAME_CI }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=$POSTGRES_USER --dbname=$POSTGRES_DB -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test project
        run: mvn -B install

      - name: Analyze with SonarCloud
        run: mvn sonar:sonar -Dsonar.projectKey=LeonMarqs_sales-support-panel-backend -Dsonar.organization=leonmarqs -Dsonar.host.url=https://sonarcloud.io
