name: Feature Branch CI & PR

on:
  push:
    branches: [ 'feature/**' ]

jobs:
  build-test-analyze-and-pr:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: ${{ secrets.DB_USER_CI }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD_CI }}
          POSTGRES_DB: ${{ secrets.DB_NAME_CI }}
        options: >-
          --health-cmd "pg_isready --username=${{ secrets.DB_USER_CI }} --dbname=${{ secrets.DB_NAME_CI }} -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin' # Distribuição popular e recomendada do OpenJDK.

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and run tests with Maven
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${{ secrets.DB_NAME_CI }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USER_CI }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD_CI }}
        run: mvn -B verify
        working-directory: .

      - name: Analyze with SonarCloud
        run: mvn -B verify sonar:sonar -Dsonar.projectKey=LeonMarqs_sales-support-panel-backend -Dsonar.organization=leonmarqs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        working-directory: ./backend

      - name: Create Pull Request
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: '[CI] Merge feature/${{ github.ref_name }} to main'
          body: |
            Pull Request created automatically by CI's workflow.
            - Build: OK
            - Tests: OK
            - SonarCloud Analysis: OK
          head: ${{ github.ref_name }}
          base: main
          update: true
